[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognitive-toolworks"
version = "2.0.0"
description = "AI-Native Skill Forge: Generate cross-platform agent artifacts (SKILL.md, AGENTS.md) using LLM intelligence"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "William Zujkowski", email = "william@example.com" }
]
keywords = [
    "ai",
    "llm",
    "skills",
    "agents",
    "mcp",
    "claude",
    "codex",
    "anthropic",
    "openai",
    "aaif",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "tiktoken>=0.7.0",
    "typer>=0.12.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "aiofiles>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.7.0",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pip-audit>=2.6",
    "bandit>=1.7",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "types-pyyaml",
    "types-aiofiles",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
claude-flow = [
    "claude-flow>=2.7.0",
]

[project.scripts]
ct = "cognitive_toolworks.cli:app"
cognitive-toolworks = "cognitive_toolworks.cli:app"

[project.urls]
Homepage = "https://github.com/williamzujkowski/cognitive-toolworks"
Documentation = "https://williamzujkowski.github.io/cognitive-toolworks"
Repository = "https://github.com/williamzujkowski/cognitive-toolworks"
Issues = "https://github.com/williamzujkowski/cognitive-toolworks/issues"
Changelog = "https://github.com/williamzujkowski/cognitive-toolworks/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/cognitive_toolworks"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/skills",
    "/tests",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (typer pattern)
    "RET504", # unnecessary assignment before return (style preference)
    "RET505", # unnecessary elif after return (style preference)
    "SIM102", # nested if statements (sometimes clearer)
    "PLW2901",# loop variable overwritten (intentional)
    "PIE810", # multiple startswith calls (clearer)
    "PYI034", # __aenter__ return type (httpx pattern)
    "EM101",  # exception string literal (convenience)
    "EM102",  # exception f-string literal (convenience)
    "S603",   # subprocess call (required for MCP)
]

[tool.ruff.lint.isort]
known-first-party = ["cognitive_toolworks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "tiktoken.*",
    "anthropic.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/cognitive_toolworks"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
