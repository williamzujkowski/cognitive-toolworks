name: Skills CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'skills/**'
      - 'tests/**'
      - 'tooling/**'
      - '.github/workflows/skills-ci.yaml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'skills/**'
      - 'tests/**'
      - 'tooling/**'
      - '.github/workflows/skills-ci.yaml'

jobs:
  skills-pipeline:
    name: Validate, Lint, Index, and Test Skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Validate skills (basic)
        id: validate
        run: |
          echo "::group::Validating SKILL.md files (basic checks)"
          python tooling/validate_skill.py --root . --json > validation-basic.json
          cat validation-basic.json

          # Check if validation passed
          status=$(python -c "import json; print(json.load(open('validation-basic.json'))['status'])")
          if [ "$status" != "success" ]; then
            echo "Basic validation failed"
            exit 1
          fi
          echo "::endgroup::"

      - name: Validate skills (quality gates)
        id: validate_quality
        continue-on-error: true
        run: |
          echo "::group::Running quality gate checks"
          python tooling/validate_skill.py --root . --check-syntax --check-todos --json > validation-quality.json
          cat validation-quality.json

          # Check results but don't fail - just report
          errors=$(python -c "import json; print(json.load(open('validation-quality.json'))['errors'])")
          warnings=$(python -c "import json; print(json.load(open('validation-quality.json'))['warnings'])")

          echo "Quality gates: $errors errors, $warnings warnings"

          if [ "$errors" -gt 0 ]; then
            echo "::warning::Quality gate checks found $errors error(s)"
            exit 1
          fi
          echo "::endgroup::"

      - name: Lint skills
        id: lint
        if: success() || failure()
        run: |
          echo "::group::Linting SKILL.md files"
          python tooling/lint_skill.py --root .
          echo "::endgroup::"

      - name: Build index
        id: build_index
        if: success() || failure()
        run: |
          echo "::group::Building skills index"
          python tooling/build_index.py --root .
          echo "::endgroup::"

      - name: Verify index
        if: success()
        run: |
          if [ ! -f index/skills-index.json ]; then
            echo "ERROR: index/skills-index.json not generated"
            exit 1
          fi
          echo "Index generated successfully:"
          cat index/skills-index.json

      - name: Run evaluations
        id: evals
        continue-on-error: true
        run: |
          echo "::group::Running skill evaluations"

          # Check if eval files exist
          eval_count=$(find tests -name 'evals_*.yaml' 2>/dev/null | wc -l)
          if [ "$eval_count" -eq 0 ]; then
            echo "No evaluation files found - skipping"
            echo "status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found $eval_count evaluation files"

          # Run the eval runner with the testing module
          python tooling/run_evals.py

          if [ $? -eq 0 ]; then
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "::error::Evaluation failures detected"
            exit 1
          fi
          echo "::endgroup::"

      - name: Upload index artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: skills-index
          path: index/skills-index.json
          retention-days: 30

      - name: Post summary
        if: always()
        run: |
          echo "# Skills CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Validation Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Basic validation
          if [ "${{ steps.validate.outcome }}" == "success" ]; then
            echo "✅ **Basic Validation**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Basic Validation**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Quality gates
          if [ "${{ steps.validate_quality.outcome }}" == "success" ]; then
            echo "✅ **Quality Gates**: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.validate_quality.outcome }}" == "failure" ]; then
            echo "⚠️ **Quality Gates**: Issues found (non-blocking)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **Quality Gates**: Skipped" >> $GITHUB_STEP_SUMMARY
          fi

          # Lint
          if [ "${{ steps.lint.outcome }}" == "success" ]; then
            echo "✅ **Lint**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Lint**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Index
          if [ "${{ steps.build_index.outcome }}" == "success" ]; then
            echo "✅ **Index**: Built successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Index**: Build failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Evaluations
          if [ "${{ steps.evals.outcome }}" == "success" ]; then
            echo "✅ **Evaluations**: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.evals.outcome }}" == "skipped" ]; then
            echo "⏭️ **Evaluations**: Skipped (no eval files)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Evaluations**: Failed (non-blocking)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Validation metrics
          if [ -f validation-basic.json ]; then
            skills_checked=$(python -c "import json; print(json.load(open('validation-basic.json'))['skills_checked'])" 2>/dev/null || echo "0")
            errors=$(python -c "import json; print(json.load(open('validation-basic.json'))['errors'])" 2>/dev/null || echo "0")
            warnings=$(python -c "import json; print(json.load(open('validation-basic.json'))['warnings'])" 2>/dev/null || echo "0")
            echo "📊 **Skills Checked**: $skills_checked" >> $GITHUB_STEP_SUMMARY
            echo "🔴 **Errors**: $errors" >> $GITHUB_STEP_SUMMARY
            echo "🟡 **Warnings**: $warnings" >> $GITHUB_STEP_SUMMARY
          fi

          # Quality gates metrics
          if [ -f validation-quality.json ]; then
            quality_errors=$(python -c "import json; print(json.load(open('validation-quality.json'))['errors'])" 2>/dev/null || echo "0")
            quality_warnings=$(python -c "import json; print(json.load(open('validation-quality.json'))['warnings'])" 2>/dev/null || echo "0")
            if [ "$quality_errors" -gt 0 ] || [ "$quality_warnings" -gt 0 ]; then
              echo "⚙️ **Quality Gate Issues**: $quality_errors errors, $quality_warnings warnings" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          # Index count
          if [ -f index/skills-index.json ]; then
            skill_count=$(python -c "import json; print(len(json.load(open('index/skills-index.json'))))" 2>/dev/null || echo "0")
            echo "📚 **Total Skills**: $skill_count" >> $GITHUB_STEP_SUMMARY
          fi
